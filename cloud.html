<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leadory Cloud</title><style>body{background:#090b09;color:#eaf3eb;font:16px system-ui;max-width:1000px;margin:auto;padding:24px}section{background:#111711;border:1px solid #263026;border-radius:14px;padding:20px;margin:16px 0}input,button,select{font:inherit;background:#19241a;color:inherit;border:1px solid #344438;border-radius:8px;padding:10px;margin:5px;max-width:95%}button{background:#22c55e;color:#07130b;cursor:pointer}h1,strong{color:#22c55e}label{display:block}#board{display:flex;overflow:auto;gap:12px}article{min-width:180px;background:#19241a;padding:12px;border-radius:8px}#status{white-space:pre-wrap} [hidden]{display:none!important}</style><h1>leadory. cloud</h1><p>CRM conectado · Sem disparos automáticos</p><section id="login"><form id="auth"><label>Chave publicável do projeto<input id="key" required autocomplete="off" placeholder="sb_publishable_..."></label><label>E-mail<input id="email" type="email" required></label><label>Senha<input id="password" type="password" required></label><button>Entrar</button></form><p>Use uma conta existente autorizada. A chave e a sessão ficam apenas na memória desta página. Não use service_role.</p></section><p id="status" role="status"></p><div id="app" hidden><button id="logout">Sair</button><section><h2>Campanhas</h2><button id="create">Criar campanha Odonto Florianópolis</button><select id="campaign"></select><button id="refresh">Atualizar</button></section><section><h2>Captação</h2><p id="metrics"></p><div id="chart"></div></section><section><h2>Novo lead manual</h2><form id="lead"><label>Empresa<input name="name" required></label><label>Telefone comercial (E.164)<input name="phone" pattern="\+[1-9][0-9]{7,14}" required></label><label>Fonte autorizada (URL)<input name="source_url" type="url" required></label><label>Site<select name="website_status"><option value="unknown">Inconclusivo</option><option value="not_identified">Não identificado</option><option value="identified">Identificado</option></select></label><button>Cadastrar</button></form></section><section><h2>CRM</h2><div id="board"></div></section></div><script>
const url='https://blmwvwutkzyugvxvmyfx.supabase.co', $=id=>document.getElementById(id), stages=['qualified','authorized','interested','meeting','proposal','won','lost'], labels=['Qualificado','Autorizado (etapa CRM)','Interessado','Reunião','Proposta','Vendido','Perdido'];let key='',token='';function status(s){$('status').textContent=s}async function req(path,method='GET',body){const headers={apikey:key,'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;if(path.startsWith('/rest/'))headers.Prefer='return=representation';const r=await fetch(url+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});const txt=await r.text();let data=txt?JSON.parse(txt):null;if(!r.ok)throw Error(data?.message||data?.msg||'HTTP '+r.status);return data}function safe(fn){return async e=>{e?.preventDefault();try{await fn(e);status('Operação concluída')}catch(err){status(err.message)}}}function elem(tag,text){const e=document.createElement(tag);e.textContent=text;return e}async function campaigns(){const rows=await req('/rest/v1/leadory_campaigns?select=*&order=created_at.desc');let selected=$('campaign').value;$('campaign').replaceChildren();for(const row of rows){const o=elem('option',row.name);o.value=row.id;$('campaign').append(o)}if(rows.some(x=>x.id===selected))$('campaign').value=selected;await leads()}async function leads(){const id=$('campaign').value;const rows=id?await req('/rest/v1/leadory_leads?select=*&campaign_id=eq.'+encodeURIComponent(id)):[];$('metrics').textContent=rows.length+' leads · '+rows.filter(x=>x.website_status==='not_identified').length+' sem site identificado · '+rows.filter(x=>x.stage==='won').length+' vendas';$('chart').replaceChildren();for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const day=d.toISOString().slice(0,10),n=rows.filter(x=>x.created_at.slice(0,10)===day).length;const line=elem('div',day+' · '+n+' ');const bar=elem('span','');bar.style.cssText='display:inline-block;background:#22c55e;height:12px;width:'+Math.min(n*8,240)+'px';line.append(bar);$('chart').append(line)}$('board').replaceChildren();stages.forEach((s,i)=>{const lane=elem('article',labels[i]);for(const row of rows.filter(x=>x.stage===s)){const p=elem('p',row.name), sel=document.createElement('select');stages.forEach((st,j)=>{const o=elem('option',labels[j]);o.value=st;o.selected=st===s;sel.append(o)});sel.onchange=safe(async()=>{const result=await req('/rest/v1/leadory_leads?id=eq.'+row.id,'PATCH',{stage:sel.value});if(!result.length)throw Error('Registro não atualizado');await leads()});p.append(sel);lane.append(p)}$('board').append(lane)})}
$('auth').onsubmit=safe(async()=>{key=$('key').value.trim();if(!key.startsWith('sb_publishable_'))throw Error('Use somente chave publicável moderna');const data=await req('/auth/v1/token?grant_type=password','POST',{email:$('email').value,password:$('password').value});token=data.access_token;$('password').value='';$('key').value='';await campaigns();$('login').hidden=true;$('app').hidden=false});$('logout').onclick=safe(async()=>{try{await req('/auth/v1/logout','POST')}finally{token='';key='';$('app').hidden=true;$('login').hidden=false;$('board').replaceChildren();$('campaign').replaceChildren();$('metrics').textContent='';$('chart').replaceChildren()}});$('create').onclick=safe(async()=>{await req('/rest/v1/leadory_campaigns','POST',{name:'Odonto Florianópolis',niche:'Clínicas odontológicas',city:'Florianópolis, SC',radius_km:50,max_companies:100,prioritize_no_website:true,require_instagram:false,require_business_phone:true});await campaigns()});$('refresh').onclick=safe(campaigns);$('campaign').onchange=safe(leads);$('lead').onsubmit=safe(async e=>{if(!$('campaign').value)throw Error('Crie uma campanha');const data=Object.fromEntries(new FormData(e.target));await req('/rest/v1/leadory_leads','POST',{...data,campaign_id:$('campaign').value});e.target.reset();await leads()});
</script></html>
